<!DOCTYPE html>
<html>

<head>
      <meta charset="utf-8">
      <link rel="stylesheet" href="./settings.css">
</head>

<body>
      <p class="header">Bluesky Downloader</p>
      <div class="settings" id="settings">
            <div class="category">
                  <div class="setting path-setting">
                        <p class="path-input-desc">Path</p>
                        <div class="path-input-container">
                              <input class="path-input" type="text">
                              <p class="path-input-ext" type="text">.mp4</p>
                        </div>
                        <div class="path-input-actions">
                              <input value="Help" class="path-input-action path-input-help" type="button">
                              <input value="Reset" class="path-input-action path-input-reset" type="button">
                        </div>
                  </div>
                  <div class="category-separator"></div>
            </div>
      </div>
      <script src="./settings.js" async defer></script>
</body>

</html>
