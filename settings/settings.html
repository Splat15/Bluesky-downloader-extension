<!DOCTYPE html>
<html>

<head>
      <title>Bluesky Downloader - Settings</title>
      <meta charset="utf-8">
      <link rel="stylesheet" href="../css/themes.css">
      <link rel="stylesheet" href="./settings.css">
      <link rel="stylesheet" href="../css/shared.css">
      <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
</head>

<body>
      <div class="body-outline" id="bodyOutline"></div>
      <div class="header">
            <p class="header-text">Bluesky downloader</p>
            <div class="category-separator" style="margin: 0; margin-top: -2px"></div>
            <div id="scrollFadeTop" class="scroll-fade"></div>
      </div>
      <div class="settings" id="settings">
            <div class="category" id="licenses-category">
                  <div class="path-input-help path-input-action-label" id="licensesButton">See licenses</div>
                  <div class="path-input-vars path-input-action-label" id="settingsImportButton">Import/Export settings
                  </div>
                  <div class="path-input-reset path-input-action-label" id="settingsResetButton">Reset</div>
            </div>
      </div>
      <div class="scrollbar-hitbox" id="scrollbar">
            <div class="scrollbar"></div>
      </div>
      <div class="scrollbar-input-block" id="scrollbarInputBlock"></div>
      <div id="scrollFadeBottom" class="scroll-fade" style="transform: rotate(180deg); position: fixed; bottom: 0px">
      </div>
      <script src="../lib/progressbar.js"></script>
      <script src="../js/classes.js"></script>
      <script src="./settings.js"></script>
</body>

</html>
